<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human or AI? Code detector</title>
<style>
  :root {
    --bg: #f3f5f2; --surface: #ffffff; --ink: #17201b; --muted: #5d6b63;
    --line: #cdd6d0; --human: #1f7a5a; --ai: #5b4bd6; --accent: #17201b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111613; --surface: #1a211d; --ink: #e8efe9; --muted: #98a79d;
      --line: #2c372f; --human: #4fc59a; --ai: #9d92ff; --accent: #e8efe9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-family: "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(1.7rem, 5vw, 2.4rem); margin: 0 0 8px; letter-spacing: -0.02em; }
  p.lead { color: var(--muted); margin: 0 0 28px; max-width: 52ch; }
  #drop { display: block; border: 2px dashed var(--line); border-radius: 12px;
    background: var(--surface); padding: 28px; text-align: center; cursor: pointer; }
  #drop:hover, #drop.over, #drop:focus-within { border-color: var(--accent); }
  #drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #preview { max-width: 100%; max-height: 340px; border-radius: 8px; display: none; margin: 0 auto 12px; }
  #hint { color: var(--muted); }
  #result { margin-top: 24px; display: none; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  #verdict { font-family: "Fira Code", ui-monospace, Menlo, Consolas, monospace;
    font-size: 1.4rem; margin: 0 0 16px; }
  .row { margin: 12px 0; }
  .row .top { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: 4px; }
  .bar { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
  #status { margin-top: 16px; color: var(--muted); font-size: .9rem; }
  #status.err { color: #c0392b; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Human or AI?</h1>
  <p class="lead">Upload a screenshot of a piece of code. The model estimates whether a person or an AI wrote it.</p>

  <label id="drop">
    <img id="preview" alt="Uploaded code preview">
    <span id="hint">Click to choose an image, or drop one here</span>
    <input type="file" id="file" accept="image/*">
  </label>

  <section id="result" aria-live="polite">
    <p id="verdict"></p>
    <div id="bars"></div>
  </section>
  <p id="status">Loading model…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/O4egSTDBP/";
  const $ = (id) => document.getElementById(id);
  let model = null;

  async function init() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      $("status").textContent = "Model ready.";
    } catch (e) {
      $("status").textContent = "Could not load the model. Check your internet connection and that the model is shared publicly.";
      $("status").className = "err";
    }
  }

  async function classify(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const img = $("preview");
    img.src = URL.createObjectURL(file);
    img.style.display = "block";
    $("hint").textContent = "Choose a different image";
    await new Promise((r) => (img.onload = r));
    if (!model) { $("status").textContent = "The model is still loading. Try again in a moment."; return; }
    $("status").textContent = "Analyzing…";
    const preds = await model.predict(img);
    preds.sort((a, b) => b.probability - a.probability);
    const top = preds[0];
    $("verdict").textContent = `${top.className} (${(top.probability * 100).toFixed(1)}%)`;
    $("bars").innerHTML = preds.map((p, i) => `
      <div class="row"><div class="top"><span>${p.className}</span><span>${(p.probability * 100).toFixed(1)}%</span></div>
      <div class="bar"><i data-w="${(p.probability * 100).toFixed(1)}" style="background:${i === 0 ? "var(--human)" : "var(--ai)"}"></i></div></div>`).join("");
    $("result").style.display = "block";
    requestAnimationFrame(() => document.querySelectorAll(".bar > i").forEach((b) => (b.style.width = b.dataset.w + "%")));
    $("status").textContent = "Done. Results are estimates, not proof.";
  }

  $("file").addEventListener("change", (e) => classify(e.target.files[0]));
  const drop = $("drop");
  ["dragover", "dragenter"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => classify(e.dataTransfer.files[0]));
  init();
</script>
</body>
</html>
